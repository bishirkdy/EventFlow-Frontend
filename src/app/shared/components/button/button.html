<button
  [type]="type()"
  [disabled]="isDisabled()"
  class="inline-flex items-center justify-center gap-2 font-medium transition duration-200 cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
  [ngClass]="{
    'bg-primary text-white hover:bg-primary-dark': variant() === 'primary',
    'border border-border bg-white text-text-primary hover:bg-surface-soft':
      variant() === 'secondary',
    'text-primary hover:bg-primary-light': variant() === 'ghost',
    'bg-error text-white hover:opacity-90': variant() === 'danger',

    'h-9 px-3 text-sm': size() === 'sm',
    'h-10 px-4 text-sm': size() === 'md',
    'h-12 px-6 text-base': size() === 'lg'
  }"
>
  @if (loading()) {
    <span
      class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      aria-hidden="true"
    ></span>
  }

  @if (label()) {
    <span>{{ label() }}</span>
  }

  <ng-content />
</button>
