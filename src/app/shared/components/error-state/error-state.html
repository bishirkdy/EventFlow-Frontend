@if (variant() === 'inline') {
  <div
    class="border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-500"
    role="alert"
    aria-live="polite"
  >
    <p>{{ message() }}</p>

    @if (showRetry()) {
      <button
        type="button"
        (click)="retry.emit()"
        class="mt-2 text-xs font-medium text-red-600 underline underline-offset-2 hover:opacity-80"
      >
        {{ retryLabel() }}
      </button>
    }
  </div>
} @else {
  <div class="p-8 text-center" role="alert" aria-live="polite">
    <p class="text-sm text-red-700">{{ message() }}</p>

    @if (showRetry()) {
      <div class="mt-4 flex justify-center">
        <app-button type="button" size="sm" [label]="retryLabel()" (click)="retry.emit()" />
      </div>
    }
  </div>
}
