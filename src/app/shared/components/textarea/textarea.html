<div class="flex flex-col gap-2">
  @if (label()) {
    <label class="text-sm font-medium text-text-primary">
      {{ label() }}
    </label>
  }

  <textarea
    [rows]="rows()"
    [placeholder]="placeholder()"
    class="w-full resize-none rounded-md border border-border bg-surface px-3 py-2 text-sm text-text-primary outline-none transition placeholder:text-text-muted focus:border-primary focus:ring-2 focus:ring-primary-light"
  ></textarea>
</div>
