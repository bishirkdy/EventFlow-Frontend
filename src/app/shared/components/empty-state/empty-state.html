<div
  class="flex flex-col items-center justify-center px-6 py-16 text-center"
>
  <div
    class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-primary-light text-primary"
    aria-hidden="true"
  >
    {{ icon() }}
  </div>

  <h3 class="text-lg font-semibold text-text-primary">
    {{ title() }}
  </h3>

  @if (message()) {
    <p class="mt-2 max-w-md text-sm text-text-secondary">
      {{ message() }}
    </p>
  }

  <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
    @if (actionLabel()) {
      <app-button type="button" [label]="actionLabel()" (click)="action.emit()" />
    }

    <ng-content />
  </div>
</div>
