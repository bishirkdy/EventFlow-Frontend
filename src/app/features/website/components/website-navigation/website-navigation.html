@if (visibleItems().length > 0) {
  <nav class="sticky top-0 z-30 border-b border-current/10 bg-white/95 backdrop-blur" aria-label="Event navigation">
    <div class="mx-auto flex max-w-7xl gap-1 overflow-x-auto px-6 py-3">
      @for (item of visibleItems(); track item.id) {
        <a
          [href]="href(item)"
          [target]="item.openInNewTab ? '_blank' : '_self'"
          [rel]="item.openInNewTab ? 'noreferrer' : null"
          class="shrink-0 px-3 py-2 text-sm font-medium opacity-65 transition hover:bg-black/5 hover:opacity-100"
        >
          {{ item.label }}
        </a>
      }
    </div>
  </nav>
}
