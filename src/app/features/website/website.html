@if (loading()) {
  <main class="grid min-h-screen place-items-center bg-white text-black">
    <p class="text-sm text-black/60">Loading website...</p>
  </main>
} @else if (error() || !data()) {
  <main class="grid min-h-screen place-items-center bg-white text-black">
    <div class="px-6 text-center">
      <h1 class="text-xl font-semibold">Unable to load this event website.</h1>
      @if (error()) {
        <p class="mt-2 text-sm text-black/60">{{ error() }}</p>
      }
    </div>
  </main>
} @else {
  <app-website-template-selector [data]="data()!" [pageSlug]="pageSlug()" />
}
