<div class="min-h-screen bg-background">
  <!-- Header -->
  <header class="sticky top-0 z-10 border-b border-border bg-white">
    <div class="mx-auto px-6 lg:px-16 py-4">
      <div class="flex items-center justify-between gap-4">
        <div class="flex min-w-0 items-center gap-3">
          <!-- <button
            type="button"
            routerLink=".."
            aria-label="Go back"
            class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-600 transition-colors hover:bg-gray-100 hover:text-primary"
          >
            <lucide-icon
              [img]="icons.ArrowLeft"
              [size]="20"
              [strokeWidth]="2"
            ></lucide-icon>
          </button> -->

          <div class="min-w-0">
            <h1 class="text-lg font-bold text-gray-900 sm:text-xl">
              Photographer Dashboard
            </h1>

            <p class="mt-1 text-sm text-gray-500">
              Manage your event photos
            </p>
          </div>
        </div>

        <span
          class="inline-flex shrink-0 items-center gap-2 bg-primary/10 px-3 py-2 text-sm font-semibold text-primary"
        >
          <lucide-icon
            [img]="icons.Camera"
            [size]="18"
            [strokeWidth]="2"
          ></lucide-icon>        
          <span class="hidden sm:inline">Photographer</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="px-4 py-6 flex items-center flex-col gap-6 lg:px-16">
    <!-- Navigation Tabs -->
    <nav
      class="mb-6 inline-flex flex-wrap gap-1 border border-border bg-[#f3efec] p-1.5"
      aria-label="Photographer navigation"
    >
      <!-- Upload Tab -->
      <a
        routerLink="upload"
        routerLinkActive
        #uploadActive="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        class="inline-flex items-center justify-center gap-2 px-5 py-3 text-sm font-semibold transition-all duration-200"
        [class.bg-white]="uploadActive.isActive"
        [class.text-primary]="uploadActive.isActive"
        [class.shadow-sm]="uploadActive.isActive"
        [class.text-gray-600]="!uploadActive.isActive"
        [class.hover:bg-white]="!uploadActive.isActive"
      >
        <lucide-icon
          [img]="icons.Upload"
          [size]="18"
          [strokeWidth]="2"
        ></lucide-icon>

        <span>Upload</span>
      </a>

      <!-- My Photos Tab -->
      <a
        routerLink="."
        routerLinkActive
        #photosActive="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        class="inline-flex items-center justify-center gap-2 px-5 py-3 text-sm font-semibold transition-all duration-200"
        [class.bg-white]="photosActive.isActive"
        [class.text-primary]="photosActive.isActive"
        [class.shadow-sm]="photosActive.isActive"
        [class.text-gray-600]="!photosActive.isActive"
        [class.hover:bg-white]="!photosActive.isActive"
      >
        <lucide-icon
          [img]="icons.Images"
          [size]="18"
          [strokeWidth]="2"
        ></lucide-icon>

        <span>My Photos</span>
      </a>
    </nav>

    <section class=" max-w-7xl w-full">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
