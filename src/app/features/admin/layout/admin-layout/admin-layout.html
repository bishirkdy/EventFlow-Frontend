<div class="flex min-h-screen flex-col bg-background">
  <!-- Header -->
  <header class="h-16 shrink-0 border-b border-border bg-surface">
    <div class="flex h-full items-center justify-between px-4 sm:px-6">
      <div class="flex min-w-0 items-center gap-3">
        <!-- Mobile menu -->
        <button
          type="button"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-text-secondary transition hover:bg-background hover:text-text-primary lg:hidden"
          (click)="toggleMobileMenu()"
          aria-label="Toggle navigation"
        >
          @if (mobileMenuOpen()) {
            <lucide-icon [img]="closeIcon" [size]="20" [strokeWidth]="1.8"></lucide-icon>
          } @else {
            <lucide-icon [img]="menuIcon" [size]="20" [strokeWidth]="1.8"></lucide-icon>
          }
        </button>

        <div class="min-w-0">
          <h1 class="truncate text-sm font-semibold text-text-primary sm:text-base">
            Platform Administration
          </h1>
          <p class="truncate text-xs text-text-muted">Read-only oversight</p>
        </div>
      </div>

      <a
        routerLink="/"
        class="inline-flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium text-text-secondary transition hover:bg-background hover:text-text-primary"
      >
        <lucide-icon [img]="homeIcon" [size]="18" [strokeWidth]="1.8"></lucide-icon>
        <span class="hidden sm:inline">Back to site</span>
      </a>
    </div>
  </header>

  <!-- Body -->
  <div class="relative flex flex-1">
    @if (mobileMenuOpen()) {
      <button
        type="button"
        class="fixed inset-0 z-40 bg-black/30 lg:hidden"
        aria-label="Close navigation"
        (click)="closeMobileMenu()"
      ></button>
    }

    <!-- Sidebar -->
    <aside
      class="fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full flex-col overflow-y-auto border-r border-border bg-surface shadow-xl transition-transform duration-200 lg:static lg:z-auto lg:w-64 lg:translate-x-0 lg:shadow-none"
      [class.translate-x-0]="mobileMenuOpen()"
    >
      <div class="flex h-16 items-center justify-between border-b border-border px-4 lg:hidden">
        <p class="text-sm font-semibold text-text-primary">Administration</p>

        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-lg text-text-secondary transition hover:bg-background hover:text-text-primary"
          (click)="closeMobileMenu()"
          aria-label="Close navigation"
        >
          <lucide-icon [img]="closeIcon" [size]="20" [strokeWidth]="1.8"></lucide-icon>
        </button>
      </div>

      <nav class="p-3" aria-label="Platform administration">
        <div class="space-y-1">
          @for (item of navigation; track item.route) {
            <a
              [routerLink]="[item.route]"
              routerLinkActive="bg-secondary-light text-secondary"
              class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-text-secondary transition hover:bg-background hover:text-text-primary"
              (click)="closeMobileMenu()"
            >
              <lucide-icon
                [img]="item.icon"
                [size]="18"
                [strokeWidth]="1.8"
                class="shrink-0"
              ></lucide-icon>
              <span class="truncate">{{ item.label }}</span>
            </a>
          }
        </div>
      </nav>
    </aside>

    <!-- Page content -->
    <main class="min-w-0 flex-1 overflow-x-hidden bg-background">
      <router-outlet />
    </main>
  </div>
</div>
