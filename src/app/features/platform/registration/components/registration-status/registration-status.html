<div
  class="inline-flex max-w-full items-center justify-center gap-3 px-4 py-3"
  [style.background]="tone().background"
  [style.border-color]="tone().border"
>
  <span
    class="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full"
    [style.background]="tone().color"
    aria-hidden="true"
  ></span>

  <p class="text-[12px] font-extrabold uppercase tracking-[0.13em]" [style.color]="tone().color">
    {{ label() }}
  </p>
</div>
