<div
  class="inline-flex max-w-full items-start gap-3 rounded-2xl border px-4 py-3"
  [style.background]="tone().background"
  [style.border-color]="tone().border"
>
  <span
    class="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full"
    [style.background]="tone().color"
    aria-hidden="true"
  ></span>

  <div class="min-w-0">
    <p
      class="text-[10px] font-extrabold uppercase tracking-[0.13em]"
      [style.color]="tone().color"
    >
      {{ label() }}
    </p>
    <p class="mt-1 text-xs leading-5" style="color: var(--color-text-secondary)">
      {{ description() }}
    </p>
  </div>
</div>
