<div class="text-center">
  <div
    class="mx-auto w-fit border p-4 shadow-sm"
    style="background: #fff; border-color: var(--color-border)"
  >
    <img
      [src]="qrUrl()"
      alt="Ticket QR code"
      class="h-48 w-48 rounded-xl object-contain"
      loading="lazy"
    />
  </div>

  <p
    class="mt-4 text-[10px] font-extrabold uppercase tracking-[0.15em]"
    style="color: var(--color-text-secondary)"
  >
    Ticket verification
  </p>
  <p class="mt-3 text-xs leading-5" style="color: var(--color-text-secondary)">
    Show this code to the event team at check-in.
  </p>
</div>
