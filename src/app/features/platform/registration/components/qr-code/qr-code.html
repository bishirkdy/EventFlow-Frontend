<div class="text-center">
  <div class="mx-auto w-fit rounded-[24px] border p-4 shadow-sm" style="background: #fff; border-color: var(--color-border)">
    <img
      [src]="qrUrl()"
      alt="Ticket QR code"
      class="h-48 w-48 rounded-xl object-contain"
      loading="lazy"
    />
  </div>

  <p class="mt-4 text-[10px] font-extrabold uppercase tracking-[0.15em]" style="color: var(--color-text-secondary)">Ticket verification</p>
  <p class="mx-auto mt-2 max-w-xs break-all font-mono text-[10px] leading-5" style="color: var(--color-text-muted)">{{ shortValue() }}</p>
  <p class="mt-3 text-xs leading-5" style="color: var(--color-text-secondary)">Show this code to the event team at check-in.</p>
</div>
