<div class="space-y-2.5">
  @if (!isCheckbox()) {
    <label
      [for]="field().fieldKey"
      class="block text-[11px] font-bold tracking-[-0.01em]"
      style="color: var(--color-text-primary)"
    >
      {{ field().label }}
      @if (isRequired()) {
        <span style="color: var(--color-primary)" aria-hidden="true"> *</span>
      }
    </label>
  }

  @if (isTextArea()) {
    <textarea
      [id]="field().fieldKey"
      [formControl]="control()"
      rows="4"
      class="w-full resize-none rounded-xl border px-4 py-3.5 text-sm outline-none transition focus:ring-2"
      style="
        background: var(--color-surface);
        color: var(--color-text-primary);
        border-color: var(--color-border);
        --tw-ring-color: var(--color-primary-light);
      "
    ></textarea>
  } @else if (isSelect()) {
    <select
      [id]="field().fieldKey"
      [formControl]="control()"
      class="w-full rounded-xl border px-4 py-3.5 text-sm outline-none transition focus:ring-2"
      style="
        background: var(--color-surface);
        color: var(--color-text-primary);
        border-color: var(--color-border);
        --tw-ring-color: var(--color-primary-light);
      "
    >
      <option value="">Select {{ field().label }}</option>
      @for (option of options(); track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  } @else if (isRadio()) {
    <div
      class="grid gap-2.5"
      role="radiogroup"
      [attr.aria-label]="field().label"
    >
      @for (option of options(); track option) {
        <label
          class="flex cursor-pointer items-center gap-3 rounded-xl border px-4 py-3 text-sm transition hover:bg-[var(--color-surface-soft)]"
          style="border-color: var(--color-border)"
        >
          <input
            type="radio"
            [name]="field().fieldKey"
            [value]="option"
            [formControl]="control()"
            class="h-4 w-4"
            style="accent-color: var(--color-primary)"
          />
          <span style="color: var(--color-text-primary)">{{ option }}</span>
        </label>
      }
    </div>
  } @else if (isCheckbox()) {
    <label
      class="flex cursor-pointer items-start gap-3 rounded-xl border px-4 py-3.5 text-sm transition hover:bg-[var(--color-surface-soft)]"
      style="border-color: var(--color-border)"
    >
      <input
        type="checkbox"
        [checked]="control().value === 'true'"
        (change)="setCheckboxValue($any($event.target).checked)"
        class="mt-0.5 h-4 w-4 shrink-0"
        style="accent-color: var(--color-primary)"
      />
      <span style="color: var(--color-text-primary)">
        {{ field().label }}
        @if (isRequired()) {
          <span style="color: var(--color-primary)" aria-hidden="true"> *</span>
        }
      </span>
    </label>
  } @else {
    <input
      [id]="field().fieldKey"
      [type]="inputType()"
      [formControl]="control()"
      class="w-full rounded-xl border px-4 py-3.5 text-sm outline-none transition focus:ring-2"
      style="
        background: var(--color-surface);
        color: var(--color-text-primary);
        border-color: var(--color-border);
        --tw-ring-color: var(--color-primary-light);
      "
    />
  }

  @if (hasError()) {
    <p class="text-xs font-medium" style="color: var(--color-error)">
      {{ errorMessage() }}
    </p>
  }
</div>
