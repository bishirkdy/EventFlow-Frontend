<div
  class="border"
  style="
    background: var(--surface);
    border-color: var(--line);
  "
>
  <div class="border-b px-6 py-5" style="border-color: var(--line)">
    <div class="flex items-start justify-between gap-4">
      <div>
        <span
          class="text-[10px] font-extrabold uppercase tracking-[0.18em]"
          style="color: var(--accent)"
        >
          Event Ticket
        </span>

        <h2
          class="mt-2 font-serif text-2xl font-medium"
          style="color: var(--ink)"
        >
          {{ ticket().ticketNumber }}
        </h2>
      </div>

      <span
        class="border px-3 py-1 text-[10px] font-extrabold uppercase tracking-[0.12em]"
        [style.color]="isRevoked() ? 'var(--muted)' : 'var(--accent)'"
        style="border-color: var(--line)"
      >
        {{ isRevoked() ? 'Revoked' : 'Active' }}
      </span>
    </div>
  </div>

  <div class="grid gap-5 p-6 sm:grid-cols-2">
    <div>
      <p
        class="text-[10px] font-extrabold uppercase tracking-[0.12em]"
        style="color: var(--muted)"
      >
        Ticket number
      </p>

      <p
        class="mt-2 font-mono text-sm"
        style="color: var(--ink)"
      >
        {{ ticket().ticketNumber }}
      </p>
    </div>

    <div>
      <p
        class="text-[10px] font-extrabold uppercase tracking-[0.12em]"
        style="color: var(--muted)"
      >
        Issued
      </p>

      <p
        class="mt-2 text-sm"
        style="color: var(--ink)"
      >
        {{ ticket().issuedAtUtc | date: 'medium' }}
      </p>
    </div>
  </div>

  @if (isRevoked()) {
    <div
      class="border-t px-6 py-4 text-sm"
      style="
        border-color: var(--line);
        color: var(--muted);
      "
    >
      This ticket is no longer active.
    </div>
  }

  @if (!isRevoked()) {
  <div
    class="border-t p-6"
    style="border-color: var(--line)"
  >
    <app-registration-qr-code
      [value]="ticket().qrCodeValue"
    />
  </div>
}
</div>
