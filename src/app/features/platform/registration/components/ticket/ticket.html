<article
  class="overflow-hidden rounded-[26px] border shadow-[0_18px_55px_rgba(28,25,23,0.07)]"
  style="background: var(--color-surface); border-color: var(--color-border)"
>
  <header class="relative overflow-hidden px-6 py-7 sm:px-7">
    <div class="absolute right-0 top-0 h-28 w-28 translate-x-8 -translate-y-8 rounded-full" style="background: var(--color-primary-light)"></div>

    <div class="relative flex items-start justify-between gap-4">
      <div>
        <p class="text-[10px] font-extrabold uppercase tracking-[0.18em]" style="color: var(--color-primary)">Your ticket</p>
        <h2 class="mt-2 font-mono text-lg font-bold tracking-tight" style="color: var(--color-text-primary)">{{ ticket().ticketNumber }}</h2>
      </div>

      <span
        class="rounded-full border px-3 py-1.5 text-[9px] font-extrabold uppercase tracking-[0.13em]"
        [style.color]="isRevoked() ? 'var(--color-text-secondary)' : 'var(--color-success)'"
        [style.background]="isRevoked() ? 'var(--color-surface-soft)' : '#f0fdf4'"
        [style.border-color]="isRevoked() ? 'var(--color-border)' : '#bbf7d0'"
      >
        {{ isRevoked() ? 'Revoked' : 'Active' }}
      </span>
    </div>
  </header>

  <div class="border-t px-6 py-6 sm:px-7" style="border-color: var(--color-border)">
    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <p class="text-[9px] font-extrabold uppercase tracking-[0.14em]" style="color: var(--color-text-muted)">Ticket number</p>
        <p class="mt-2 font-mono text-sm font-semibold" style="color: var(--color-text-primary)">{{ ticket().ticketNumber }}</p>
      </div>
      <div>
        <p class="text-[9px] font-extrabold uppercase tracking-[0.14em]" style="color: var(--color-text-muted)">Issued</p>
        <p class="mt-2 text-sm font-medium" style="color: var(--color-text-primary)">{{ ticket().issuedAtUtc | date: 'mediumDate' }}</p>
      </div>
    </div>
  </div>

  @if (!isRevoked()) {
    <div class="border-t px-6 py-7 sm:px-7" style="border-color: var(--color-border)">
      <app-registration-qr-code [value]="ticket().qrCodeValue" />
    </div>
  } @else {
    <div class="border-t px-6 py-5" style="border-color: var(--color-border)">
      <p class="text-sm leading-6" style="color: var(--color-text-secondary)">This ticket is no longer valid for entry.</p>
    </div>
  }
</article>
