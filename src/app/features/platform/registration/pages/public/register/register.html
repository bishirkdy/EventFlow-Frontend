<div
  class="site min-h-screen"
  style="background: var(--paper); color: var(--ink)"
>
  @if (loading()) {
    <div class="flex min-h-screen items-center justify-center">
      <p
        class="text-sm"
        style="color: var(--muted)"
      >
        Loading registration...
      </p>
    </div>
  }

  @else if (error()) {
    <div class="flex min-h-screen items-center justify-center px-6">
      <div class="max-w-md text-center">
        <span
          class="text-[10px] font-extrabold uppercase tracking-[0.2em]"
          style="color: var(--accent)"
        >
          Registration
        </span>

        <h1
          class="mt-3 font-serif text-4xl tracking-[-0.04em]"
          style="color: var(--ink)"
        >
          Registration unavailable
        </h1>

        <p
          class="mt-4 text-sm leading-7"
          style="color: var(--muted)"
        >
          {{ error() }}
        </p>

        <button
          type="button"
          class="mt-7 px-6 py-3 text-[11px] font-extrabold uppercase tracking-[0.15em]"
          style="background: var(--deep); color: #fff"
          (click)="loadRegistrationForm()"
        >
          Try again
        </button>
      </div>
    </div>
  }

  @else if (registrationForm(); as form) {
    @if (!form.isActive) {
      <div class="flex min-h-screen items-center justify-center px-6">
        <div class="max-w-md text-center">
          <span
            class="text-[10px] font-extrabold uppercase tracking-[0.2em]"
            style="color: var(--accent)"
          >
            Registration
          </span>

          <h1
            class="mt-3 font-serif text-4xl tracking-[-0.04em]"
            style="color: var(--ink)"
          >
            Registration is closed
          </h1>

          <p
            class="mt-4 text-sm leading-7"
            style="color: var(--muted)"
          >
            This event is not currently accepting registrations.
          </p>
        </div>
      </div>
    }

    @else {
      <app-registration-form
        [registrationForm]="form"
        (submitted)="submitRegistration($event)"
      />
    }
  }
</div>
