<main class="bg-background">
  <!-- Intro -->
  <section class="border-b border-border bg-surface py-20 sm:py-24 lg:py-28">
    <div class="container-app">
      <div class="max-w-3xl">
        <span class="text-sm font-semibold uppercase tracking-[0.2em] text-primary">
          Features
        </span>

        <h1
          class="mt-5 text-4xl font-bold leading-[1.05] tracking-[-0.04em] text-text-primary sm:text-5xl lg:text-6xl"
        >
          Everything this website
          <span class="text-primary"> helps you do.</span>
        </h1>

        <p class="mt-6 text-base leading-7 text-text-secondary sm:text-lg sm:leading-8">
          From the first idea to the final certificate, EventFlow connects the entire event journey
          into a single, easy-to-use platform.
        </p>

        <div class="mt-9 flex flex-col gap-3 sm:flex-row">
          <a routerLink="/create-event">
            <app-button label="Create an Event" size="lg" />
          </a>

          <a routerLink="/event-setup">
            <app-button label="See Setup Guide" variant="secondary" size="lg" />
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Capabilities -->
  <app-platform-features />

  <!-- CTA -->
  <section class="py-20 sm:py-24 lg:py-28">
    <div class="container-app">
      <div
        class="rounded-3xl border border-border bg-surface px-8 py-14 text-center sm:px-16 sm:py-20"
      >
        <h2 class="text-3xl font-bold tracking-[-0.03em] text-text-primary sm:text-4xl">
          See it all in one workspace
        </h2>

        <p class="mx-auto mt-5 max-w-xl text-base leading-7 text-text-secondary">
          Create an event to explore every feature, or reach out and we will help you get started.
        </p>

        <div class="mt-9 flex flex-col justify-center gap-3 sm:flex-row">
          <a routerLink="/create-event">
            <app-button label="Get Started" size="lg" />
          </a>

          <a routerLink="/contact">
            <app-button label="Contact Us" variant="secondary" size="lg" />
          </a>
        </div>
      </div>
    </div>
  </section>
</main>
