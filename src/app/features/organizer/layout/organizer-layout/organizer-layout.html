<div class="flex min-h-screen flex-col bg-[#FAF8F6]">

  <!-- Header -->
  <header class="h-16 shrink-0 border-b border-[#E7E2DE] bg-white">
    <div class="flex h-full items-center justify-between px-6">

      <div>
        @if (event(); as currentEvent) {
          <h1 class="text-lg font-semibold text-[#1C1917]">
            {{ currentEvent.name }}
          </h1>

          <p class="text-xs text-[#A8A29E]">
            {{ currentEvent.eventType }}
          </p>
        }
      </div>

      @if (event(); as currentEvent) {
        <span
          class="rounded-full bg-[#FBE9E6] px-3 py-1 text-xs font-medium text-[#B5473A]"
        >
          {{ currentEvent.status }}
        </span>
      }

    </div>
  </header>


  <!-- Organizer Body -->
  <div class="flex flex-1">

    <!-- Sidebar -->
    <aside class="w-64 shrink-0 border-r border-[#E7E2DE] bg-white">

      <nav class="space-y-1 p-4">

        @for (item of navItems(); track item.route) {

          <a
            [routerLink]="[item.route]"
            routerLinkActive="bg-[#FBE9E6] text-[#B5473A]"
            [routerLinkActiveOptions]="{
              exact: item.route === ''
            }"
            class="flex items-center rounded-lg px-3 py-2.5 text-sm font-medium text-[#57534E] transition hover:bg-[#F5F2EF]"
          >
            {{ item.label }}
          </a>

        }

      </nav>

    </aside>


    <!-- Page Content -->
    <main class="min-w-0 flex-1">

      <router-outlet />

    </main>

  </div>

</div>
