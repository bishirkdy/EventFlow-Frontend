<div class="min-h-full bg-background p-6 lg:p-8">@if(loading()){<div class="py-24 text-center text-sm text-text-secondary">Loading speaker…</div>}@else{<div class="mx-auto max-w-4xl"><button (click)="back()" class="mb-8 text-sm text-text-secondary hover:text-text-primary">← Back</button><div class="border-b border-border pb-8"><p class="text-xs font-semibold uppercase tracking-[0.22em] text-secondary">Speaker profile</p><h1 class="mt-3 text-4xl font-semibold tracking-tight text-text-primary">Edit speaker</h1></div><form [formGroup]="form" (ngSubmit)="submit()" class="mt-10 grid gap-8 lg:grid-cols-[280px_1fr]"><div><div class="aspect-[4/5] overflow-hidden bg-surface">@if(preview()){<img [src]="preview()!" class="h-full w-full object-cover" alt="Speaker"/>}@else{<div class="grid h-full place-items-center text-text-muted">No portrait</div>}</div><input class="mt-4 block w-full border border-border bg-surface px-3 py-3 text-xs file:mr-3 file:border-0 file:bg-primary file:px-3 file:py-2 file:text-xs file:text-white" type="file" accept="image/jpeg,image/png,image/webp" (change)="pick($event)"/></div><div class="space-y-7"><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Name</label><input formControlName="name" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/></div><div class="grid gap-7 sm:grid-cols-2"><input formControlName="designation" placeholder="Designation" class="border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/><input formControlName="organization" placeholder="Organization" class="border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/></div><div class="grid gap-7 sm:grid-cols-2"><input type="email" formControlName="email" placeholder="Email" class="border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/><input type="number" formControlName="displayOrder" placeholder="Display order" class="border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/></div><textarea rows="7" formControlName="bio" placeholder="Biography" class="w-full resize-none border border-border bg-surface p-4 text-sm outline-none focus:border-primary"></textarea><label class="flex items-center gap-3 text-sm text-text-secondary"><input type="checkbox" formControlName="isActive" class="h-4 w-4 accent-[var(--color-primary)]"/> Visible on the public website</label><div class="flex justify-end gap-4 border-t border-border pt-6"><button type="button" (click)="back()" class="px-4 py-3 text-sm text-text-secondary">Cancel</button><button [disabled]="saving()" class="bg-primary px-7 py-3 text-sm font-semibold text-white">{{saving()?'Saving…':'Save changes'}}</button></div></div></form></div>}
</div>
