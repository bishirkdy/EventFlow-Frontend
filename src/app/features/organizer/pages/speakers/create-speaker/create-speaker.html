<div class="min-h-full bg-background p-6 lg:p-8"><div class="mx-auto max-w-4xl"><button (click)="back()" class="mb-8 text-sm text-text-secondary hover:text-text-primary">← Back to speakers</button><div class="border-b border-border pb-8"><p class="text-xs font-semibold uppercase tracking-[0.22em] text-secondary">Speaker profile</p><h1 class="mt-3 text-4xl font-semibold tracking-tight text-text-primary">Add a speaker</h1><p class="mt-2 text-sm text-text-secondary">Create a polished profile for the event website and session program.</p></div><form [formGroup]="form" (ngSubmit)="submit()" class="mt-10 grid gap-8 lg:grid-cols-[280px_1fr]"><div><div class="aspect-[4/5] overflow-hidden bg-surface">@if(preview()){<img [src]="preview()!" class="h-full w-full object-cover" alt="Speaker preview"/>}@else{<div class="grid h-full place-items-center border border-dashed border-border text-center text-xs uppercase tracking-widest text-text-muted">Portrait preview</div>}</div><input class="mt-4 block w-full border border-border bg-surface px-3 py-3 text-xs text-text-secondary file:mr-3 file:border-0 file:bg-primary file:px-3 file:py-2 file:text-xs file:font-semibold file:text-white" type="file" accept="image/jpeg,image/png,image/webp" (change)="pick($event)"/><p class="mt-2 text-xs text-text-muted">One portrait. Stored through Cloudinary.</p></div><div class="space-y-7"><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Name</label><input formControlName="name" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary" placeholder="e.g. Anika Menon"/>@if(form.controls.name.touched&&form.controls.name.invalid){<p class="mt-1 text-xs text-red-600">Speaker name is required.</p>}</div><div class="grid gap-7 sm:grid-cols-2"><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Designation</label><input formControlName="designation" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary" placeholder="Principal Architect"/></div><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Organization</label><input formControlName="organization" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary" placeholder="Company / Institution"/></div></div><div class="grid gap-7 sm:grid-cols-2"><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Email</label><input type="email" formControlName="email" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary" placeholder="speaker@example.com"/></div><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Display order</label><input type="number" min="0" formControlName="displayOrder" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/></div></div><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Bio</label><textarea rows="7" formControlName="bio" class="mt-2 w-full resize-none border border-border bg-surface p-4 text-sm leading-6 outline-none focus:border-primary" placeholder="Short professional biography..."></textarea></div><div class="flex items-center justify-end gap-5 border-t border-border pt-6"><button type="button" (click)="back()" class="px-4 py-3 text-sm text-text-secondary">Cancel</button><button [disabled]="loading()" class="bg-primary px-7 py-3 text-sm font-semibold text-white disabled:opacity-50">{{loading()?'Creating…':'Create speaker'}}</button></div></div></form></div></div>
