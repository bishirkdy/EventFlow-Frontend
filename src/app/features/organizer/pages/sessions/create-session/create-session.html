<div class="min-h-full bg-background p-6">
  <div class="mx-auto max-w-3xl">

    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold text-text-primary">
          Create Session
        </h1>

        <p class="mt-1 text-sm text-text-secondary">
          Create a new session for your event.
        </p>
      </div>

      <button
        type="button"
        (click)="cancel()"
        class="border border-border px-4 py-2 text-sm
               font-medium text-text-secondary
               hover:bg-surface hover:text-text-primary"
      >
        Cancel
      </button>
    </div>

    @if (error()) {
      <div
        class="mb-6 border border-red-500/30 bg-red-500/10
               px-4 py-3 text-sm text-red-500"
      >
        {{ error() }}
      </div>
    }

    <form
      (ngSubmit)="createSession()"
      class="border border-border bg-surface"
    >

      <div class="border-b border-border px-6 py-5">
        <h2 class="text-lg font-medium text-text-primary">
          Session Information
        </h2>

        <p class="mt-1 text-sm text-text-muted">
          Enter the information for this session.
        </p>
      </div>

      <div class="space-y-6 p-6">

        <!-- Section -->
        <div>
          <label
            for="sectionId"
            class="mb-2 block text-sm font-medium text-text-primary"
          >
            Section
          </label>

          @if (loadingSections()) {
            <div class="text-sm text-text-muted">
              Loading sections...
            </div>
          } @else {
            <select
              id="sectionId"
              name="sectionId"
              [(ngModel)]="session.sectionId"
              class="w-full border border-border bg-background
                     px-4 py-3 text-sm text-text-primary
                     outline-none focus:border-primary"
            >
              <option value="">
                Select a section
              </option>

              @for (section of sections(); track section.id) {
                <option [value]="section.id">
                  {{ section.name }}
                </option>
              }
            </select>
          }
        </div>

        <!-- Title -->
        <div>
          <label
            for="title"
            class="mb-2 block text-sm font-medium text-text-primary"
          >
            Title
          </label>

          <input
            id="title"
            name="title"
            type="text"
            [(ngModel)]="session.title"
            placeholder="Enter session title"
            class="w-full border border-border bg-background
                   px-4 py-3 text-sm text-text-primary
                   outline-none placeholder:text-text-muted
                   focus:border-primary"
          />
        </div>

        <!-- Description -->
        <div>
          <label
            for="description"
            class="mb-2 block text-sm font-medium text-text-primary"
          >
            Description
          </label>

          <textarea
            id="description"
            name="description"
            rows="4"
            [(ngModel)]="session.description"
            placeholder="Enter session description"
            class="w-full resize-none border border-border
                   bg-background px-4 py-3 text-sm
                   text-text-primary outline-none
                   placeholder:text-text-muted
                   focus:border-primary"
          ></textarea>
        </div>

        <!-- Session Type -->
        <div>
          <label
            for="sessionType"
            class="mb-2 block text-sm font-medium text-text-primary"
          >
            Session Type
          </label>

          <input
            id="sessionType"
            name="sessionType"
            type="text"
            [(ngModel)]="session.sessionType"
            placeholder="Example: Workshop, Talk, Panel"
            class="w-full border border-border bg-background
                   px-4 py-3 text-sm text-text-primary
                   outline-none placeholder:text-text-muted
                   focus:border-primary"
          />
        </div>

        <!-- Capacity -->
        <div>
          <label
            for="capacity"
            class="mb-2 block text-sm font-medium text-text-primary"
          >
            Capacity
          </label>

          <input
            id="capacity"
            name="capacity"
            type="number"
            min="1"
            [(ngModel)]="session.capacity"
            placeholder="Optional"
            class="w-full border border-border bg-background
                   px-4 py-3 text-sm text-text-primary
                   outline-none placeholder:text-text-muted
                   focus:border-primary"
          />

          <p class="mt-1 text-xs text-text-muted">
            Leave empty if there is no capacity limit.
          </p>
        </div>

      </div>

      <div
        class="flex justify-end gap-3 border-t border-border
               px-6 py-4"
      >
        <button
          type="button"
          (click)="cancel()"
          class="border border-border px-5 py-2.5 text-sm
                 font-medium text-text-secondary
                 hover:bg-background"
        >
          Cancel
        </button>

        <button
          type="submit"
          [disabled]="saving() || loadingSections()"
          class="bg-primary px-5 py-2.5 text-sm font-medium
                 text-white transition hover:opacity-90
                 disabled:cursor-not-allowed disabled:opacity-50"
        >
          @if (saving()) {
            Creating...
          } @else {
            Create Session
          }
        </button>
      </div>

    </form>
  </div>
</div>
