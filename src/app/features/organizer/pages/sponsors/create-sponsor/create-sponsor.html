<div class="min-h-full bg-background p-6 lg:p-8"><div class="mx-auto max-w-4xl"><button (click)="back()" class="mb-8 text-sm text-text-secondary">← Back to sponsors</button><div class="border-b border-border pb-8"><p class="text-xs font-semibold uppercase tracking-[0.22em] text-secondary">Partner profile</p><h1 class="mt-3 text-4xl font-semibold tracking-tight text-text-primary">Add a sponsor</h1><p class="mt-2 text-sm text-text-secondary">Create a sponsor profile with level, identity and optional logo.</p></div><form [formGroup]="form" (ngSubmit)="submit()" class="mt-10 grid gap-10 lg:grid-cols-[320px_1fr]"><div><div class="aspect-[16/9] bg-surface p-8">@if(preview()){<img [src]="preview()!" class="h-full w-full object-contain" alt="Sponsor logo preview"/>}@else{<div class="grid h-full place-items-center border border-dashed border-border text-center text-xs uppercase tracking-widest text-text-muted">Logo preview</div>}</div><input class="mt-4 block w-full border border-border bg-surface px-3 py-3 text-xs file:mr-3 file:border-0 file:bg-primary file:px-3 file:py-2 file:text-xs file:text-white" type="file" accept="image/jpeg,image/png,image/webp, image/svg+xml" (change)="pick($event)"/><p class="mt-2 text-xs text-text-muted">One logo. Stored through Cloudinary.</p></div><div class="space-y-7"><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Organization</label><input formControlName="name" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary" placeholder="Company or organization"/>@if(form.controls.name.touched&&form.controls.name.invalid){<p class="mt-1 text-xs text-red-600">Sponsor name is required.</p>}</div><div class="grid gap-7 sm:grid-cols-2"><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Partnership level</label><select formControlName="sponsorLevel" class="mt-2 w-full border border-border bg-surface px-3 py-3 text-sm outline-none focus:border-primary"><option>Platinum</option><option>Gold</option><option>Silver</option><option>Bronze</option><option>Presenting Partner</option><option>Cultural Partner</option><option>Community Partner</option><option>Partner</option></select></div><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Display order</label><input type="number" formControlName="displayOrder" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/></div></div><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Website</label><input formControlName="websiteUrl" class="mt-2 w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary" placeholder="https://example.com"/></div><div><label class="text-xs font-semibold uppercase tracking-widest text-text-muted">Description</label><textarea rows="7" formControlName="description" class="mt-2 w-full resize-none border border-border bg-surface p-4 text-sm leading-6 outline-none focus:border-primary" placeholder="What does this partnership support?"></textarea></div><div class="flex justify-end gap-4 border-t border-border pt-6"><button type="button" (click)="back()" class="px-4 py-3 text-sm text-text-secondary">Cancel</button><button [disabled]="loading()" class="bg-primary px-7 py-3 text-sm font-semibold text-white">{{loading()?'Creating…':'Create sponsor'}}</button></div></div></form></div></div>
