<div class="min-h-full bg-background p-6 lg:p-8">@if(loading()){<div class="py-24 text-center text-sm text-text-secondary">Loading sponsor…</div>}@else if(sponsor();as s){<div class="mx-auto max-w-5xl"><div class="flex items-center justify-between border-b border-border pb-6"><button (click)="back()" class="text-sm text-text-secondary">← Sponsors</button><button (click)="edit()" class="bg-primary px-5 py-2.5 text-sm font-semibold text-white">Edit sponsor</button></div><div class="py-12"><span class="text-xs font-semibold uppercase tracking-[0.22em] text-secondary">{{s.sponsorLevel}}</span><div class="mt-7 grid gap-12 lg:grid-cols-[1fr_1.2fr] lg:items-center"><div class="aspect-[16/9] bg-surface p-12">@if(s.logoUrl){<img [src]="s.logoUrl" [alt]="s.name" class="h-full w-full object-contain"/>}@else{<div class="grid h-full place-items-center text-3xl font-semibold text-text-muted">{{s.name}}</div>}</div><div><h1 class="text-5xl font-semibold tracking-tight text-text-primary">{{s.name}}</h1>@if(s.description){<p class="mt-6 text-base leading-8 text-text-secondary">{{s.description}}</p>}@if(s.websiteUrl){<a class="mt-7 inline-block border-b border-primary pb-1 text-sm font-semibold text-primary" [href]="s.websiteUrl" target="_blank" rel="noreferrer">Visit website ↗</a>}</div></div></div></div>}@else{<div class="py-24 text-center text-sm text-text-secondary">Sponsor not found.</div>}</div>
