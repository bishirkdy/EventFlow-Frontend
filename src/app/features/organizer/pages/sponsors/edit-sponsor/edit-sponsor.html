<div class="min-h-full bg-background p-6 lg:p-8">@if(loading()){<div class="py-24 text-center text-sm text-text-secondary">Loading sponsor…</div>}@else{<div class="mx-auto max-w-4xl"><button (click)="back()" class="mb-8 text-sm text-text-secondary">← Back</button><div class="border-b border-border pb-8"><p class="text-xs font-semibold uppercase tracking-[0.22em] text-secondary">Partner profile</p><h1 class="mt-3 text-4xl font-semibold tracking-tight text-text-primary">Edit sponsor</h1></div><form [formGroup]="form" (ngSubmit)="submit()" class="mt-10 grid gap-10 lg:grid-cols-[320px_1fr]"><div><div class="aspect-[16/9] bg-surface p-8">@if(preview()){<img [src]="preview()!" class="h-full w-full object-contain" alt="Sponsor logo"/>}@else{<div class="grid h-full place-items-center text-text-muted">No logo</div>}</div><input class="mt-4 block w-full border border-border bg-surface px-3 py-3 text-xs file:mr-3 file:border-0 file:bg-primary file:px-3 file:py-2 file:text-xs file:text-white" type="file" accept="image/jpeg,image/png,image/webp,image/svg+xml" (change)="pick($event)"/></div><div class="space-y-7"><input formControlName="name" placeholder="Organization" class="w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/><div class="grid gap-7 sm:grid-cols-2"><select formControlName="sponsorLevel" class="border border-border bg-surface px-3 py-3 text-sm outline-none focus:border-primary"><option>Platinum</option><option>Gold</option><option>Silver</option><option>Bronze</option><option>Presenting Partner</option><option>Cultural Partner</option><option>Community Partner</option><option>Partner</option></select><input type="number" formControlName="displayOrder" placeholder="Display order" class="border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/></div><input formControlName="websiteUrl" placeholder="Website" class="w-full border-0 border-b border-border bg-transparent px-0 py-3 text-sm outline-none focus:border-primary"/><textarea rows="7" formControlName="description" placeholder="Description" class="w-full resize-none border border-border bg-surface p-4 text-sm outline-none focus:border-primary"></textarea><label class="flex items-center gap-3 text-sm text-text-secondary"><input type="checkbox" formControlName="isActive"/> Visible on the public website</label><div class="flex justify-end gap-4 border-t border-border pt-6"><button type="button" (click)="back()" class="px-4 py-3 text-sm text-text-secondary">Cancel</button><button [disabled]="saving()" class="bg-primary px-7 py-3 text-sm font-semibold text-white">{{saving()?'Saving…':'Save changes'}}</button></div></div></form></div>}</div>
