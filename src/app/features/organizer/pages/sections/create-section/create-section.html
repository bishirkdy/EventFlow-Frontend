<div class="p-6">

  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-[#1C1917]">
      Create Section
    </h1>

    <p class="mt-1 text-sm text-[#A8A29E]">
      Add a new section to this event.
    </p>
  </div>

  <form
    class="max-w-xl space-y-5"
    (ngSubmit)="create()"
  >

    <div>
      <label class="mb-1 block text-sm font-medium text-[#57534E]">
        Name
      </label>

      <input
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="Section name"
        class="w-full rounded-lg border border-[#E7E2DE] px-3 py-2.5 text-sm outline-none focus:border-[#B5473A]"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-[#57534E]">
        Description
      </label>

      <textarea
        name="description"
        [(ngModel)]="description"
        rows="4"
        placeholder="Section description"
        class="w-full rounded-lg border border-[#E7E2DE] px-3 py-2.5 text-sm outline-none focus:border-[#B5473A]"
      ></textarea>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-[#57534E]">
        Display Order
      </label>

      <input
        type="number"
        name="displayOrder"
        [(ngModel)]="displayOrder"
        min="0"
        class="w-full rounded-lg border border-[#E7E2DE] px-3 py-2.5 text-sm outline-none focus:border-[#B5473A]"
      />
    </div>

    @if (error(); as message) {
      <p class="text-sm text-red-600">
        {{ message }}
      </p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="rounded-lg bg-[#B5473A] px-5 py-2.5 text-sm font-medium text-white hover:bg-[#8F332A] disabled:opacity-50"
    >
      {{ loading() ? 'Creating...' : 'Create Section' }}
    </button>

  </form>

</div>
