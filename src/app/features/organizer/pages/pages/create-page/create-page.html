<div class="max-w-2xl">
  <h1 class="text-2xl font-semibold text-stone-900">
    Create Page
  </h1>

  <div class="mt-6 space-y-4">

    <input
      [(ngModel)]="name"
      type="text"
      placeholder="Page name"
      class="w-full rounded-lg border border-stone-300 px-4 py-3"
    />

    <input
      [(ngModel)]="slug"
      type="text"
      placeholder="Page slug"
      class="w-full rounded-lg border border-stone-300 px-4 py-3"
    />

    <input
      [(ngModel)]="pageType"
      type="text"
      placeholder="Page type"
      class="w-full rounded-lg border border-stone-300 px-4 py-3"
    />

    <input
      [(ngModel)]="displayOrder"
      type="number"
      min="0"
      placeholder="Display order"
      class="w-full rounded-lg border border-stone-300 px-4 py-3"
    />

    @if (error()) {
      <p class="text-sm text-red-600">
        {{ error() }}
      </p>
    }

    <button
      type="button"
      (click)="create()"
      [disabled]="loading()"
      class="rounded-lg bg-[#B5473A] px-5 py-3 font-medium text-white disabled:opacity-50"
    >
      {{ loading() ? 'Creating...' : 'Create Page' }}
    </button>

  </div>
</div>
