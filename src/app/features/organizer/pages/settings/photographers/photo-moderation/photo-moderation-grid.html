<div class="photo-moderation p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Photo Moderation</h1>
        <p class="text-gray-600 dark:text-gray-400 mt-1">Review and moderate event photos</p>
      </div>
      <span class="text-sm text-gray-500 dark:text-gray-400">{{ totalCount() }} photo{{ totalCount() !== 1 ? 's' : '' }}</span>
    </div>

    <div class="mb-6 flex gap-2">
      <button type="button" (click)="onFilterChange('all')" [class]="filterStatus() === 'all' ? 'bg-primary text-white' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">All ({{ totalCount() }})</button>
      <button type="button" (click)="onFilterChange('visible')" [class]="filterStatus() === 'visible' ? 'bg-primary text-white' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">Approved</button>
      <button type="button" (click)="onFilterChange('hidden')" [class]="filterStatus() === 'hidden' ? 'bg-primary text-white' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">Pending</button>
    </div>

    <div *ngIf="loading()">
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
        <div *ngFor="let i of skeletonSlots" class="aspect-square bg-muted animate-pulse rounded-xl"></div>
      </div>
    </div>

    <div *ngIf="!loading() && photos().length === 0" class="text-center py-12">
      <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
      <h3 class="mt-4 text-lg font-medium text-gray-900 dark:text-white">No photos yet</h3>
      <p class="mt-2 text-gray-500 dark:text-gray-400">Photos uploaded by photographers will appear here for review.</p>
    </div>

    <div *ngIf="!loading() && photos().length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
      <app-photo-card
        *ngFor="let photo of photos(); trackBy: trackByPhotoId"
        [photo]="photo"
        [loading]="loading()"
        (open)="openPhoto($event)"
        (toggleVisibility)="toggleVisibility($event)"
        (deletePhoto)="deletePhoto($event)">
      </app-photo-card>
    </div>

    <div *ngIf="!loading() && totalPages() > 1" class="mt-6 flex items-center justify-center gap-2">
      <button type="button" (click)="onPageChange(currentPage() - 1)" [disabled]="!hasPreviousPage()" class="px-3 py-2 rounded-lg font-medium bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-border hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Previous</button>
      <span class="px-3 py-2 text-sm text-gray-600 dark:text-gray-400">Page {{ currentPage() }} of {{ totalPages() }}</span>
      <button type="button" (click)="onPageChange(currentPage() + 1)" [disabled]="!hasNextPage()" class="px-3 py-2 rounded-lg font-medium bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-border hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Next</button>
    </div>
  </div>
</div>
