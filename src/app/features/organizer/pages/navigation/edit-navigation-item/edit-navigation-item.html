<div class="p-6 lg:p-8">@if(loading){<div class="py-10 text-center text-sm text-text-muted">Loading navigation item...</div>}@else{<div class="mb-6"><h1 class="text-2xl font-semibold text-text-primary">Edit Navigation Item</h1><p class="mt-1 text-sm text-text-secondary">Update this event navigation item.</p></div><form [formGroup]="form" (ngSubmit)="submit()" class="max-w-2xl border border-border bg-surface"><div class="space-y-6 p-6"><div><label class="mb-2 block text-sm font-medium text-text-primary">Label</label><input type="text" formControlName="label" class="w-full border border-border bg-background px-4 py-3 text-sm text-text-primary outline-none focus:border-primary" />@if(form.controls.label.touched&&form.controls.label.invalid){<p class="mt-1 text-sm text-red-600">A label is required.</p>}</div><div><label class="mb-2 block text-sm font-medium text-text-primary">Page</label><select formControlName="pageId" class="w-full border border-border bg-background px-4 py-3 text-sm text-text-primary outline-none focus:border-primary"><option value="">{{loadingPages?'Loading pages...':'Select a published page'}}</option>@for(page of pageOptions;track page.id){<option [value]="page.id">{{page.name}}</option>}</select></div><label class="flex items-center gap-3 text-sm text-text-primary"><input type="checkbox" formControlName="isVisible" class="h-4 w-4" />Visible</label><label class="flex items-center gap-3 text-sm text-text-primary"><input type="checkbox" formControlName="openInNewTab" class="h-4 w-4" />Open in new tab</label></div><div class="flex justify-end gap-3 border-t border-border p-6"><button type="button" (click)="cancel()" class="border border-border px-4 py-2 text-sm font-medium text-text-primary">Cancel</button><button type="submit" [disabled]="form.invalid||saving" class="bg-primary px-4 py-2 text-sm font-medium text-white disabled:opacity-50">{{saving?'Saving...':'Save Changes'}}</button></div></form>}</div>
