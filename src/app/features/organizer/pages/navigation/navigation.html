<div class="space-y-4">

  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-stone-900">
      Navigation Menus
    </h1>

    <a
      routerLink="create"
      class="rounded-lg bg-[#B5473A] px-4 py-2 text-sm font-medium text-white"
    >
      Create Menu
    </a>
  </div>

  @if (loading()) {
    <p class="text-stone-500">
      Loading navigation menus...
    </p>
  }

  @if (!loading()) {

    @if (menus().length === 0) {
      <p class="text-stone-500">
        No navigation menus found.
      </p>
    }

    @for (menu of menus(); track menu.id) {
      <div class="rounded-lg border border-stone-200 bg-white p-4">

        <div class="flex items-center justify-between">

          <div>
            <h2 class="font-medium text-stone-900">
              {{ menu.name }}
            </h2>

            <p class="mt-1 text-sm text-stone-500">
              Location: {{ menu.location }}
            </p>
          </div>

          <div class="flex gap-2">

            <a
              [routerLink]="[menu.id, 'items']"
              class="rounded-lg border border-stone-300 px-3 py-2 text-sm"
            >
              Items
            </a>

            <button
              type="button"
              (click)="deleteMenu(menu.id)"
              class="rounded-lg border border-red-200 px-3 py-2 text-sm text-red-600"
            >
              Delete
            </button>

          </div>

        </div>

      </div>
    }

  }

</div>
