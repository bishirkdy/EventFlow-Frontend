<div class="space-y-6 p-6"><div><h2 class="text-2xl font-semibold">Attendance Staff</h2><p class="text-sm text-text-muted">Assign staff to an event, section, or session.</p></div><div class="grid gap-3 rounded-2xl border border-border bg-surface p-5 md:grid-cols-4"><input class="rounded-xl border border-border bg-background px-4 py-3" [(ngModel)]="email" placeholder="Staff email"/><select class="rounded-xl border border-border bg-background px-4 py-3" [(ngModel)]="scopeType"><option [ngValue]="1">Event</option><option [ngValue]="2">Section</option><option [ngValue]="3">Session</option></select><input class="rounded-xl border border-border bg-background px-4 py-3" [(ngModel)]="scopeId" placeholder="Section / Session ID"/><button class="rounded-xl bg-secondary px-5 py-3 font-semibold text-white" (click)="assign()">Assign Staff</button></div><div class="overflow-hidden rounded-2xl border border-border bg-surface"><table class="min-w-full text-sm"><thead class="border-b border-border bg-background"><tr><th class="px-4 py-3 text-left">Email</th><th class="px-4 py-3 text-left">Scope</th><th class="px-4 py-3 text-left">Scope ID</th><th></th></tr></thead><tbody>@for(x of staff();track x.id){<tr class="border-b border-border"><td class="px-4 py-3">{{x.email || x.userId}}</td><td class="px-4 py-3">{{x.scopeType}}</td><td class="px-4 py-3">{{x.scopeId||'Event'}}</td><td class="px-4 py-3 text-right"><button class="text-red-600" (click)="revoke(x)">Revoke</button></td></tr>}</tbody></table></div></div>
