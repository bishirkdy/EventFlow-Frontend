<div class="p-6 lg:p-8">
  <div class="flex items-start justify-between border-b border-border pb-6">
    <div>
      <h1 class="text-2xl font-semibold text-text-primary">Event Features</h1>

      <p class="mt-1 text-sm text-text-secondary">
        Choose the features available for this event website.
      </p>
    </div>

    <button
      type="button"
      (click)="resetFeatures()"
      [disabled]="resetting()"
      class="border border-border px-4 py-2 text-sm font-medium text-text-primary transition hover:bg-surface disabled:cursor-not-allowed disabled:opacity-50"
    >
      @if (resetting()) {
        Resetting...
      } @else {
        Reset Features
      }
    </button>
  </div>

  <app-async-state
    class="mt-6 block"
    [loading]="loading()"
    [error]="error()"
    [empty]="features().length === 0"
    skeleton="list"
    [skeletonCount]="4"
    emptyTitle="No features found"
    emptyMessage="There are no configurable features for this event."
    (retry)="retry()"
  >
    <ng-template>
      <div class="divide-y divide-border border-y border-border">
        @for (feature of features(); track feature.id) {
          <div class="flex items-center justify-between gap-6 py-5">
            <div class="min-w-0">
              <h3 class="text-sm font-medium text-text-primary">
                {{ feature.featureName }}
              </h3>

              @if (feature.featureDescription) {
                <p class="mt-1 text-sm text-text-secondary">
                  {{ feature.featureDescription }}
                </p>
              }
            </div>

            <button
              type="button"
              role="switch"
              [attr.aria-checked]="feature.isEnabled"
              [disabled]="updatingFeatureId() === feature.id"
              (click)="toggleFeature(feature)"
              class="relative h-6 w-11 shrink-0 rounded-full transition disabled:cursor-not-allowed disabled:opacity-50"
              [class.bg-primary]="feature.isEnabled"
              [class.bg-border]="!feature.isEnabled"
            >
              <span
                class="absolute top-1 h-4 w-4 rounded-full bg-white transition"
                [class.left-6]="feature.isEnabled"
                [class.left-1]="!feature.isEnabled"
              ></span>
            </button>
          </div>
        }
      </div>
    </ng-template>
  </app-async-state>
</div>
