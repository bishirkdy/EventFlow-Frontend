<div class="p-6 lg:p-8">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-text-primary">Create Navigation Item</h1>
    <p class="mt-1 text-sm text-text-secondary">Choose an event page for this menu item.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="max-w-2xl border border-border bg-surface">
    <div class="space-y-6 p-6">
      <div>
        <label class="mb-2 block text-sm font-medium text-text-primary">Label</label>
        <input type="text" formControlName="label" class="w-full border border-border bg-background px-4 py-3 text-sm text-text-primary outline-none focus:border-primary" placeholder="Home" />
        @if (form.controls.label.touched && form.controls.label.invalid) { <p class="mt-1 text-sm text-red-600">A label is required.</p> }
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-text-primary">Page</label>
        <select formControlName="pageId" class="w-full border border-border bg-background px-4 py-3 text-sm text-text-primary outline-none focus:border-primary" [disabled]="loadingPages">
          <option value="">{{ loadingPages ? 'Loading pages...' : 'Select a published page' }}</option>
          @for (page of pageOptions; track page.id) { <option [value]="page.id">{{ page.name }}</option> }
        </select>
        @if (form.controls.pageId.touched && form.controls.pageId.invalid) { <p class="mt-1 text-sm text-red-600">Select a page.</p> }
      </div>

    </div>

    <div class="flex justify-end gap-3 border-t border-border p-6">
      <button type="button" (click)="cancel()" class="border border-border px-4 py-2 text-sm font-medium text-text-primary">Cancel</button>
      <button type="submit" [disabled]="form.invalid || saving" class="bg-primary px-4 py-2 text-sm font-medium text-white disabled:opacity-50">{{ saving ? 'Creating...' : 'Create Item' }}</button>
    </div>
  </form>
</div>
