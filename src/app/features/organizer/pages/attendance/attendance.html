<div class="space-y-6 p-6"><div><h2 class="text-2xl font-semibold">Attendance Dashboard</h2><p class="text-sm text-text-muted">Event check-in and check-out operations.</p></div>@if(dashboard();as d){<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><div class="rounded-2xl border border-border bg-surface p-5"><p class="text-sm text-text-muted">Checked in</p><p class="mt-2 text-3xl font-bold">{{d.checkedIn}}</p></div><div class="rounded-2xl border border-border bg-surface p-5"><p class="text-sm text-text-muted">Checked out</p><p class="mt-2 text-3xl font-bold">{{d.checkedOut}}</p></div><div class="rounded-2xl border border-border bg-surface p-5"><p class="text-sm text-text-muted">Currently inside</p><p class="mt-2 text-3xl font-bold">{{d.currentlyInside}}</p></div><div class="rounded-2xl border border-border bg-surface p-5"><p class="text-sm text-text-muted">Attendance</p><p class="mt-2 text-3xl font-bold">{{d.attendancePercentage | number:'1.0-1'}}%</p></div></div>}<div class="rounded-2xl border border-border bg-surface p-6"><h3 class="text-lg font-semibold">QR Check-in</h3><div class="mt-4 flex flex-col gap-3 sm:flex-row"><input class="min-h-11 flex-1 rounded-xl border border-border bg-background px-4" [ngModel]="qr()" (ngModelChange)="qr.set($event)" placeholder="Scan or paste ticket QR value"/><button class="rounded-xl bg-secondary px-5 py-3 font-semibold text-white" (click)="checkIn()">Verify & Check In</button><button class="rounded-xl border border-border px-5 py-3" (click)="camera()">{{scanning()?'Opening…':'Camera'}}</button></div></div></div>
