<div class="space-y-6 p-6"><div><h2 class="text-2xl font-semibold">Notifications</h2><p class="text-sm text-text-muted">Queue event announcements and targeted email.</p></div><div class="space-y-3 rounded-2xl border border-border bg-surface p-5"><input class="w-full rounded-xl border border-border bg-background px-4 py-3" [(ngModel)]="recipientEmail" placeholder="Recipient email"/><input class="w-full rounded-xl border border-border bg-background px-4 py-3" [(ngModel)]="subject" placeholder="Subject"/><textarea class="min-h-32 w-full rounded-xl border border-border bg-background px-4 py-3" [(ngModel)]="body" placeholder="Message"></textarea><button class="rounded-xl bg-secondary px-5 py-3 font-semibold text-white" (click)="send()">Queue Email</button></div><div class="space-y-2">@for(x of items();track x.id){<div class="rounded-xl border border-border bg-surface p-4 flex justify-between"><div><span class="font-medium">{{x.subject}}</span><p class="text-sm text-text-muted">{{x.recipientEmail}}</p></div><span class="text-xs text-text-muted">{{x.status}}</span></div>}</div></div>
