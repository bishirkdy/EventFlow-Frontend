<div class="min-h-full bg-background px-6 py-8 md:px-10 md:py-10">

  <div class="mx-auto max-w-3xl">

    <!-- Back -->
    <button
      type="button"
      (click)="goBack()"
      class="mb-10 inline-flex items-center gap-2 text-sm font-medium text-text-secondary transition hover:text-primary"
    >
      <span class="text-lg">←</span>
      Back to Venues
    </button>


    <app-async-state
      [loading]="loading()"
      [error]="error()"
      layout="inline"
      loadingView="text"
      loadingLabel="Loading venue..."
      (retry)="reload()"
    >
      <ng-template>
        @if (venue(); as venue) {

      <!-- Header -->
      <div class="mb-10 flex items-start justify-between gap-6">

        <div>
          <h1
            class="text-3xl font-semibold tracking-tight text-text-primary"
          >
            {{ venue.name | capitalize }}
          </h1>

          <p class="mt-2 text-sm text-text-secondary">
            Venue details
          </p>
        </div>

        <button
          type="button"
          (click)="editVenue()"
          class="shrink-0 bg-primary px-5 py-3 text-sm font-medium text-white transition hover:opacity-90"
        >
          Edit
        </button>

      </div>


      <!-- Details -->
      <div class="border-t border-border">

        <!-- Description -->
        <div class="border-b border-border py-6">

          <p class="text-xs font-medium uppercase tracking-wide text-text-muted">
            Description
          </p>

          <p class="mt-2 text-sm leading-6 text-text-primary">
            {{ venue.description || 'No description' }}
          </p>

        </div>


        <!-- Address -->
        <div class="border-b border-border py-6">

          <p class="text-xs font-medium uppercase tracking-wide text-text-muted">
            Address
          </p>

          <p class="mt-2 text-sm leading-6 text-text-primary">
            {{ venue.address || 'No address' }}
          </p>

        </div>


        <!-- Capacity -->
        <div class="border-b border-border py-6">

          <p class="text-xs font-medium uppercase tracking-wide text-text-muted">
            Capacity
          </p>

          <p class="mt-2 text-sm text-text-primary">
            {{ venue.capacity }}
          </p>

        </div>


        <!-- Status -->
        <div class="border-b border-border py-6">

          <p class="text-xs font-medium uppercase tracking-wide text-text-muted">
            Status
          </p>

          <p
            class="mt-2 text-sm font-medium"
            [class.text-primary]="venue.isActive"
            [class.text-text-muted]="!venue.isActive"
          >
            {{ venue.isActive ? 'Active' : 'Inactive' }}
          </p>

        </div>

      </div>
        }
      </ng-template>
    </app-async-state>

  </div>

</div>
