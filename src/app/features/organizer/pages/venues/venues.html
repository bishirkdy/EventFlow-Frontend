<div class="min-h-full bg-background px-6 py-8 md:px-10 md:py-10">
  <div class="mx-auto max-w-6xl">
    <!-- Header -->
    <div class="mb-10 flex items-end justify-between gap-6">
      <div>
        <h1 class="text-3xl font-semibold tracking-tight text-text-primary">Venues</h1>

        <p class="mt-2 text-sm text-text-secondary">Manage the locations used for your event.</p>
      </div>

      <button
        type="button"
        (click)="createVenue()"
        class="inline-flex items-center gap-2 bg-primary px-5 py-3 text-sm font-medium text-white transition hover:opacity-90"
      >
        <span class="text-lg leading-none">+</span>
        Add Venue
      </button>
    </div>

    <app-async-state
      [loading]="loading()"
      [error]="error()"
      [empty]="venues().length === 0"
      layout="inline"
      skeleton="list"
      [skeletonCount]="4"
      emptyTitle="No venues yet"
      emptyMessage="Add a venue to start organizing locations for your event."
      emptyActionLabel="Add your first venue"
      (retry)="loadVenues()"
      (emptyAction)="createVenue()"
    >
      <ng-template>
        <div class="border-t border-border">
          @for (venue of venues(); track venue.id) {
            <div class="group border-b border-border py-6 transition">
              <div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between">
                <!-- Venue Info -->
                <div class="min-w-0">
                  <div class="flex items-center gap-3">
                    <h2 class="text-lg font-medium text-text-primary">
                      {{ venue.name | capitalize }}
                    </h2>

                    <span class="text-xs text-text-muted"> {{ venue.capacity }} capacity </span>
                  </div>

                  @if (venue.description) {
                    <p class="mt-2 max-w-2xl text-sm leading-6 text-text-secondary">
                      {{ venue.description }}
                    </p>
                  }

                  @if (venue.address) {
                    <div class="mt-3 flex items-start gap-2">
                      <span class="text-sm text-text-muted"> ⌖ </span>

                      <p class="text-sm text-text-secondary">
                        {{ venue.address }}
                      </p>
                    </div>
                  }
                </div>

                <!-- Actions -->
                <div class="flex shrink-0 items-center gap-5">
                  <button
                    type="button"
                    (click)="viewVenue(venue.id)"
                    class="text-sm font-medium text-primary transition hover:opacity-70"
                  >
                    View details
                  </button>

                  <button
                    type="button"
                    (click)="editVenue(venue.id)"
                    class="text-sm font-medium text-text-secondary transition hover:text-text-primary"
                  >
                    Edit
                  </button>

                  <button type="button" [disabled]="deleting()" (click)="deleteVenue(venue.id)">
                    Delete
                  </button>
                </div>
              </div>
            </div>
          }
        </div>
      </ng-template>
    </app-async-state>
  </div>
</div>
